name: Update dashboard

on:
  schedule:
    - cron: "17 * * * *"   # her saat başı (UTC, :17)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: npm test

      - name: Restore previous snapshot (cache)
        run: |
          url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/snapshot.json.gz"
          curl -fsSL "$url" -o /tmp/prev.json.gz && echo "önbellek bulundu" || echo "önbellek yok"

      - name: Fetch OnAir data & compute metrics
        id: fetch
        continue-on-error: true
        timeout-minutes: 9
        env:
          ONAIR_API_KEY: ${{ secrets.ONAIR_API_KEY }}
          ONAIR_VA_ID: ${{ secrets.ONAIR_VA_ID }}
          ONAIR_COMPANY_ID: ${{ secrets.ONAIR_COMPANY_ID }}
          IDLE_HOURS: ${{ vars.IDLE_HOURS || '24' }}
          FLIGHT_DAYS: ${{ vars.FLIGHT_DAYS || '30' }}
          FETCH_BUDGET_MS: "420000"
          PROXY_URL: ${{ vars.PROXY_URL }}
        run: |
          if [ -z "$ONAIR_API_KEY" ] || { [ -z "$ONAIR_VA_ID" ] && [ -z "$ONAIR_COMPANY_ID" ]; }; then
            echo "::notice::OnAir secret'ları yok — herkese açık modda yayınlanıyor (ziyaretçiler kendi verisiyle bağlanır)."
            node scripts/build.mjs --public
          else
            node scripts/build.mjs --cache /tmp/prev.json.gz
          fi

      - name: Fallback — rebuild from last snapshot (never demo when secrets exist)
        if: steps.fetch.outcome != 'success'
        env:
          IDLE_HOURS: ${{ vars.IDLE_HOURS || '24' }}
          PROXY_URL: ${{ vars.PROXY_URL }}
        run: |
          if [ -f /tmp/prev.json.gz ]; then
            echo "::warning::Canlı veri alınamadı; son snapshot ile yeniden derleniyor (yeni tasarım yine de yayınlanır)."
            node scripts/build.mjs --raw /tmp/prev.json.gz
            cp /tmp/prev.json.gz site/data/snapshot.json.gz
          else
            echo "::error::Canlı veri alınamadı ve önbellek yok — yayın yapılmıyor, mevcut site korunuyor."
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
