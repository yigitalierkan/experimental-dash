name: CORS check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Proxy checks
        run: |
          O="https://${{ github.repository_owner }}.github.io"
          P="$(cat proxy/url.txt)"
          echo "== PROXY health"; curl -s -D - "$P/health" -H "Origin: $O" | grep -i -E "^HTTP|access-control|^ok" || true
          echo "== PROXY preflight"; curl -s -o /dev/null -D - -X OPTIONS "$P/api/v1/regular_routes" -H "Origin: $O" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: oa-apikey" | grep -i -E "^HTTP|access-control" || true
          echo "== PROXY no key (expect 401)"; curl -s -o /dev/null -w "%{http_code}\n" "$P/api/v1/regular_routes" -H "Origin: $O"
          echo "== PROXY dummy key → OnAir (expect OnAir error, not CORS)"; curl -s -D - "$P/api/v1/regular_routes" -H "Origin: $O" -H "oa-apikey: 00000000-0000-0000-0000-000000000000" | grep -i -E "^HTTP|access-control-allow-origin" || true
          echo "== PROXY foreign origin (expect 403)"; curl -s -o /dev/null -w "%{http_code}\n" "$P/health" -H "Origin: https://evil.example"
          echo "== PROXY POST (expect 405)"; curl -s -o /dev/null -w "%{http_code}\n" -X POST "$P/api/v1/fbos/jobs/x/accept" -H "Origin: $O"
